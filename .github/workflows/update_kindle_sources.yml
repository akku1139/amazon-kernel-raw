name: Update Kindle Source Releases

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日UTC 0時
  workflow_dispatch:       # 手動実行

permissions:
  contents: write          # リリース作成/更新とstateファイルのコミットに必要

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run release updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: python update_releases.py

      - name: Commit state file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases_state.json
          git diff --cached --quiet || git commit -m "Update Kindle source release state"
          git push